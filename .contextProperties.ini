# Configuration file for qmllint and the QML language server.
#
# KDE translation functions (i18n and friends) are injected into the QML engine
# at runtime by the Plasma shell, so they are unqualified lookups that static
# analysis cannot resolve. Declaring them here keeps the QML LSP useful without
# turning UnqualifiedAccess off wholesale, which would also hide typos.
[General]
disableUnqualifiedAccess = "i18n,i18nc,i18nd,i18ndc,i18np,i18ncp,i18ndp,i18ndcp,xi18n,xi18nc,xi18nd,xi18ndc,xi18np"
